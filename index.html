<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Slider — ООП (Прототипи та Класи)</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="slider-wrapper" id="sliderWrapper">
      <div class="slider" id="slider">
        <div class="slider__track" id="sliderTrack">
          <div class="slider__slide">
            <img
              src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80"
              alt="Гірський пейзаж"
            />
            <div class="slider__caption">
              <h2>Гірські вершини</h2>
              <p>Велична природа та чисте повітря високо в горах.</p>
            </div>
          </div>
          <div class="slider__slide">
            <img
              src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80"
              alt="Морський берег"
            />
            <div class="slider__caption">
              <h2>Океанський бриз</h2>
              <p>Безкрайній горизонт і теплий пісок під ногами.</p>
            </div>
          </div>
          <div class="slider__slide">
            <img
              src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1200&q=80"
              alt="Лісова стежка"
            />
            <div class="slider__caption">
              <h2>Таємничий ліс</h2>
              <p>Сонячні промені крізь густі крони дерев.</p>
            </div>
          </div>
          <div class="slider__slide">
            <img
              src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1200&q=80"
              alt="Нічне небо"
            />
            <div class="slider__caption">
              <h2>Зоряна ніч</h2>
              <p>Чумацький Шлях над засніженими хребтами.</p>
            </div>
          </div>
        </div>
        <!-- Кнопки навигации, индикаторы и панель управления создаются через JS -->
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
